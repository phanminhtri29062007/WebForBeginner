<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1 id="top">Final Project</h1>
  </header>

  <main>
    <p>An attempt at responsive web design's final project</p>

    <p>Pictures about cities</p>
    
    <div class = "grid">
        <figure>
        <img src="images/waterfall.jpg" alt="waterfall">
        <figcaption>Beautiful Waterfall</figcaption>
        </figure>
        <figure>
        <img src="images/beautifulcity.webp" alt="European city">
        <figcaption>European city</figcaption>
        </figure>
        <figure>
        <img src="images/noonnightLandscape.jpg" alt="Noon landscape">
        <figcaption>Noon landscape</figcaption>
        </figure>
        <figure>
        <img src="images/images.jpg" alt="Dark city bottom up">
        <figcaption>Dark city</figcaption>
        </figure>
        <figure>
        <img src="images/dark_city.jpg" alt="Dark city from far">
        <figcaption>Dark city from far</figcaption>
        </figure>
        <figure>
        <img src="images/EuropeanCity.jpg" alt="European city">
        <figcaption>European city</figcaption>
        </figure>
        <figure>
        <img src="images/timesquare.jpg" alt="morning timesquare">
        <figcaption>Morning Time square</figcaption>
        </figure>
        <figure>
        <img src="images/timesquareContrast.jpg" alt="night timesquare">
        <figcaption>Time square at night</figcaption>
        </figure>
        <figure>
        <img src="images/moderncity.webp" alt="Beautiful modern city from far">
        <figcaption>Beautiful modern city</figcaption>
        </figure>
    </div>
  </main>

  <footer>
    <a href="#top">Jump to the Top</a>
  </footer>
</body>

</html>
