  <header class="hero">
    <div class="avatar"><img src="beautifulcity.webp" style="aspect-ratio: 1/1; height: 100%; border-radius: 50%;"></div>
    <h1>Phan Minh Tri</h1>
    <p class="role">Creative Developer · UI/UX Designer</p>
  </header>

  <section class="section">
    <h2><span class="tag">Get in touch</span></h2>
    <ul class="contact-list">
      <li><span class="icon">@</span><a href="mailto:example@gmail.com">example@gmail.com</a></li>
      <li><span class="icon">in</span><a href="#">linkedin.com/in/minh-tri-dev</a></li>
      <li><span class="icon">gi</span><a href="https://github.com/phanminhtri29062007">github.com/phanminhtri29062007</a></li>
    </ul>

    <form class="contact-form" onsubmit="return false;">
      <div>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@email.com">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="What are you building?"></textarea>
      </div>
      <button type="submit">Send message</button>
    </form>
  </section>

  <footer>
    <span>© 2026 Phan Minh Tri</span>
  </footer>

</div>
